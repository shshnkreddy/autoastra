[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoastra"
version = "0.1.0"
description = "Run a supervised coding agent against a task-defined fitness function in Docker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib"]

[project.scripts]
autoastra = "autoastra.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["autoastra", "autoastra.*", "tasks", "tasks.*"]
namespaces = false

[tool.setuptools.package-data]
"tasks.affine" = ["*.json"]
